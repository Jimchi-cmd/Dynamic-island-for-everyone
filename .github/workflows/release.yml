name: Release

# Push a tag such as v0.1.0 to build every installer and open a DRAFT
# release (publishing it is a manual step; see docs/publishing-checklist.md).
# Or merge a new version into main: publish.yml calls this workflow with
# that version's tag, and the release is created, tagged and published here.
# Dry runs (same builds, uploaded as workflow artifacts, no release): run it
# by hand, or push packaging changes to dev.
on:
  push:
    tags: ["v*"]
    branches: [dev]
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - src-tauri/tauri*.json
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, e.g. v0.1.0 (created on main's commit).
        type: string
        required: true
      publish:
        description: Publish straight away instead of opening a draft.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc makes the Linux packages run on more distros.
          - name: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: windows
            os: windows-latest
            bundles: msi,nsis
          # One universal build serves Intel and Apple-silicon Macs.
          - name: macos
            os: macos-15-intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      # Updates are signed only when the maintainer has set up a key
      # (docs/signing.md). Without one, the release still builds; Settings
      # then links to the release page instead of updating in place.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.ISLET_UPDATER_PUBKEY != '' }}
      # Windows code signing through SignPath, once the project is approved
      # and its token and ids are set (docs/signing.md §3).
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # The release's tag: pushed (refs/tags/v…) or handed over by publish.yml.
      TAG: ${{ inputs.tag || github.ref_name }}
      # Islet Pro's store (docs/pro.md). These ids are public, so they are
      # repository variables, not secrets. Unset: the build says Pro isn't on sale.
      ISLET_POLAR_ORG: ${{ vars.ISLET_POLAR_ORG }}
      ISLET_LEMON_STORE: ${{ vars.ISLET_LEMON_STORE }}
      ISLET_LEMON_PRODUCT: ${{ vars.ISLET_LEMON_PRODUCT }}
      ISLET_BUY_URL: ${{ vars.ISLET_BUY_URL }}
      IS_RELEASE: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { key: release }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci

      - name: Version matches the tag
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: bash scripts/check-version.sh "$TAG"

      - name: Updater configuration
        shell: bash
        run: |
          configs=()
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            pubkey=$(printf '%s' "$ISLET_UPDATER_PUBKEY" | tr -d '\r\n ')
            echo "ISLET_UPDATER_PUBKEY=$pubkey" >> "$GITHUB_ENV"
            cat > "$RUNNER_TEMP/updater.json" <<EOF
          {
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": {
              "updater": {
                "pubkey": "$pubkey",
                "endpoints": ["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"],
                "requireSignedVersion": true
              }
            }
          }
          EOF
            configs+=(--config "$RUNNER_TEMP/updater.json")
            echo "Signed updates: on"
          else
            echo "::warning::No updater signing key configured: this release will not update in place (docs/signing.md)."
          fi
          echo "UPDATER_ARGS=${configs[*]}" >> "$GITHUB_ENV"
        env:
          ISLET_UPDATER_PUBKEY: ${{ vars.ISLET_UPDATER_PUBKEY }}

      - name: macOS signing and notarization (only when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$S_APPLE_CERTIFICATE" ]; then
            echo "::warning::Not signing for macOS: no APPLE_CERTIFICATE secret (docs/signing.md)."
            exit 0
          fi
          # Exported only when set: the bundler treats an empty value as a certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val=$(printenv "S_$v" || true)
            [ -n "$val" ] || continue
            delim="EOF_${RANDOM}${RANDOM}"
            { echo "$v<<$delim"; echo "$val"; echo "$delim"; } >> "$GITHUB_ENV"
          done

      - name: Build the island (Linux, Windows)
        if: matrix.name != 'macos'
        run: cargo build --release -p islet -p islet-perf
      - name: Build the island and MediaRemote helper (macOS universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release -p islet -p islet-mediaremote --target aarch64-apple-darwin
          cargo build --release -p islet -p islet-mediaremote --target x86_64-apple-darwin
          cargo build --release -p islet-perf

      - name: Stage the island for bundling
        shell: bash
        run: bash scripts/stage-island.sh ${{ matrix.name == 'macos' && 'universal-apple-darwin' || '' }}

      - name: Stop Spotlight indexing (dmg builds fail when it holds the image)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Build installers
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            args=(--target universal-apple-darwin --config src-tauri/tauri.bundle.macos.json)
          else
            args=(--config src-tauri/tauri.bundle.json)
          fi
          for attempt in 1 2 3; do
            npx tauri build --bundles ${{ matrix.bundles }} "${args[@]}" $UPDATER_ARGS && exit 0
            echo "::warning::bundling failed (attempt $attempt)"
            sleep 10
          done
          exit 1

      - name: Collect release files
        shell: bash
        run: |
          shopt -s nullglob
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          case "${{ matrix.name }}" in
            linux)
              cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm out/
              cp target/release/bundle/appimage/*.AppImage* out/
              ;;
            windows)
              cp target/release/bundle/msi/*.msi* target/release/bundle/nsis/*-setup.exe* out/
              # Portable: both programs in a zip, no installer.
              mkdir -p portable && cp target/release/islet.exe target/release/islet-settings.exe portable/
              cp LICENSE portable/LICENSE.txt
              7z a -tzip "out/Islet_${ver}_x64_portable.zip" ./portable/*
              ;;
            macos)
              b=target/universal-apple-darwin/release/bundle
              cp $b/dmg/*.dmg out/
              for f in $b/macos/*.app.tar.gz $b/macos/*.app.tar.gz.sig; do
                cp "$f" "out/$(basename "$f" | sed "s/^Islet\.app/Islet_${ver}_universal.app/")"
              done
              ;;
          esac
          ls -la out

      # Windows code signing (SignPath Foundation, free for open source):
      # the installers go up as an artifact, come back signed into out/,
      # and their update signatures are made again over the signed files.
      - name: Upload the Windows installers for signing
        id: unsigned
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: |
            out/*.msi
            out/*-setup.exe
          retention-days: 1
      - name: Sign the Windows installers (SignPath)
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'islet' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out
      - name: Update signatures over the signed installers
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          for f in out/*.msi out/*-setup.exe; do
            npx tauri signer sign "$f"
          done

      - name: MSIX package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ver = node -p "require('./src-tauri/tauri.conf.json').version"
          ./scripts/msix.ps1 -Version $ver -Out out

      - name: GNOME Shell extension (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y libglib2.0-bin zip
          bash scripts/gnome-extension.sh out

      - name: Size budget
        shell: bash
        run: |
          shopt -s nullglob
          target/release/islet-perf size out/*.{deb,rpm,AppImage,msi,msix,exe,dmg,zip} --markdown size.md --enforce
          cat size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Signed update bundles were produced
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          sigs=(out/*.sig)
          [ ${#sigs[@]} -gt 0 ] || { echo "::error::signing is configured but no .sig files were produced"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # The phone companion's APK: signed with the project's key when its
  # secrets are set (docs/phone.md), else a debug build that still installs.
  android:
    name: Build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Protocol tests
        working-directory: android
        run: gradle :protocol:test --no-daemon
      - name: Signed release build
        if: env.HAS_ANDROID_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ISLET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ISLET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ISLET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/islet-release.jks"
          ISLET_ANDROID_KEYSTORE="$RUNNER_TEMP/islet-release.jks" gradle :app:assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/islet-release.jks"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/Islet-${TAG#v}-android.apk"
      - name: Debug build (no signing key set)
        if: env.HAS_ANDROID_KEY != 'true'
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Islet-${TAG#v}-android-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [build, android]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.ISLET_UPDATER_PUBKEY != '' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      # Only the installers and their files go on the release: a build can
      # leave a folder among them (one left `fonts`), which neither the
      # checksums nor the upload can take.
      - name: Only the release files
        run: |
          mkdir files
          find assets -maxdepth 1 -type f -exec mv {} files/ \;
          left=$(find assets -mindepth 1 -maxdepth 1)
          [ -z "$left" ] || { echo "Left out (not files):"; echo "$left"; }
          ls -la files

      - name: Update manifest (latest.json)
        if: env.HAS_UPDATER_KEY == 'true'
        run: |
          echo "See the release notes: https://github.com/${{ github.repository }}/releases/tag/${TAG}" > notes.txt
          python3 scripts/make-latest-json.py "$TAG" files \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}" notes.txt

      - name: Checksums
        working-directory: files
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes (from the CHANGELOG)
        run: |
          ver="${TAG#v}"
          {
            echo "**New to Islet?** Follow the [step-by-step manual](https://github.com/${{ github.repository }}/blob/main/docs/manual.md) to download, install and set it up."
            echo
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release
        if: ${{ !inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" files/* \
            --repo "${{ github.repository }}" \
            --draft --verify-tag --notes-file release-notes.md \
            --title "Islet ${TAG#v}"

      # From publish.yml: tag main's commit and publish. (The tag is made with
      # this job's token, so it doesn't start the tag-push run again.)
      - name: Tag and publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" files/* \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" --latest --notes-file release-notes.md \
            --title "Islet ${TAG#v}"
