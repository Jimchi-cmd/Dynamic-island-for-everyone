name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: npm run build # clippy needs dist/ for generate_context!
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build, size & perf (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
            app: target/release/islet
          - os: windows-latest
            bundles: msi,nsis
            app: target/release/islet.exe
          - os: macos-latest
            bundles: app,dmg
            app: target/release/islet
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run build # generate_context! needs dist/
      - run: cargo test --workspace
      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - run: cargo build --release -p islet-perf

      - name: Installer sizes
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,msi/*.msi,nsis/*.exe,dmg/*.dmg})
          target/release/islet-perf size "${files[@]}" --markdown size.md --enforce
          cat size.md >> "$GITHUB_STEP_SUMMARY"

      # Phase 0 gate: report numbers without failing the build until the
      # budget decision is made. Flip continue-on-error to false afterwards.
      - name: Perf budgets
        continue-on-error: true
        shell: bash
        run: |
          args=(run --app ${{ matrix.app }} --idle-secs 60 --active-secs 20 --json perf.json --markdown perf.md --enforce)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/islet-perf "${args[@]}"
          else
            target/release/islet-perf "${args[@]}"
          fi
      - name: Perf summary
        if: always()
        shell: bash
        run: '[ -f perf.md ] && cat perf.md >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: islet-${{ matrix.os }}
          path: |
            perf.json
            perf.md
            size.md
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: ignore
          retention-days: 14
