name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: npm run build # clippy needs dist/ for generate_context!
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build, size & perf (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
            exe: ""
          - os: windows-latest
            bundles: msi,nsis
            exe: .exe
          # Apple-silicon runners are capacity-limited and jobs often go
          # unscheduled; the Intel image is reliably available.
          - os: macos-15-intel
            bundles: app,dmg
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run build # generate_context! needs dist/
      - run: cargo test --workspace
      - run: cargo build --release -p islet -p islet-perf
      # Linux runners have no display: GUI processes run under Xvfb.
      - name: Define run_gui helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_gui.sh" <<'EOF'
          if [ "$RUNNER_OS" = "Linux" ]; then
            exec xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- "$@"
          fi
          exec "$@"
          EOF

      # The island itself: a native, webview-free overlay. Budgets enforced.
      - name: Perf budgets (native island)
        shell: bash
        run: >
          bash "$RUNNER_TEMP/run_gui.sh" target/release/islet-perf run --app target/release/islet${{ matrix.exe }}
          --idle-secs 60 --active-secs 20 --json perf-native.json --markdown perf-native.md --enforce

      - name: Build installers (Tauri settings app)
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Installer and binary sizes
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/islet${{ matrix.exe }} target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,msi/*.msi,nsis/*.exe,dmg/*.dmg})
          target/release/islet-perf size "${files[@]}" --markdown size.md --enforce

      # Phase 0 baseline: the same pill drawn by a Tauri webview. Reported for
      # comparison only; it is expected to exceed the RAM budget.
      - name: Perf baseline (Tauri webview pill)
        continue-on-error: true
        shell: bash
        run: >
          bash "$RUNNER_TEMP/run_gui.sh" target/release/islet-perf run --app target/release/islet-settings${{ matrix.exe }}
          --idle-secs 30 --active-secs 15 --json perf-tauri.json --markdown perf-tauri.md

      - name: Job summary
        if: always()
        shell: bash
        run: |
          for f in perf-native.md size.md perf-tauri.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: islet-${{ matrix.os }}
          path: |
            perf-*.json
            perf-*.md
            size.md
            target/release/islet${{ matrix.exe }}
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: ignore
          retention-days: 14
