[package]
name = "islet-settings"
description = "Islet Settings: setup, permissions, navigation and updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "islet_settings_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
islet-core = { path = "../crates/islet-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Signed in-app updates. OS TLS on macOS and Windows, rustls on Linux.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
tauri-plugin-updater = "2"
