[package]
name = "islet-mediaremote"
description = "macOS Now Playing helper for Islet, loaded into /usr/bin/perl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Loaded with DynaLoader by the system perl (see crates/islet/src/providers/macos_mediaremote.rs).
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSObjCRuntime", "NSOperation", "NSString"] }
