[package]
name = "islet"
description = "Islet: a lightweight Dynamic Island-style overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom = "0.3"
islet-core = { path = "../islet-core" }
islet-render = { path = "../islet-render" }
serde_json = "1"
sha2 = "0.10"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
zune-jpeg = "0.4"

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

# HTTPS for the Routes API: the OS TLS stack on macOS (Security.framework)
# and Windows (SChannel); rustls with the system's trusted roots on Linux.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.ureq]
version = "3"
default-features = false
features = ["native-tls-no-default"]

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies.ureq]
version = "3"
default-features = false
features = ["rustls", "platform-verifier"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "xkb"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-collections = "0.3"
# The #[implement] macro (COM callbacks) refers to windows_core directly.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Devices_WiFi",
  "Networking_Connectivity",
  "Security_Credentials",
  "Devices_Power",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "System_Power",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Rpc",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
islet-mediaremote = { path = "../islet-mediaremote" }
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSGeometry", "NSEnumerator", "NSNotification", "NSObjCRuntime", "NSOperation", "NSOrderedSet", "NSSet", "NSRunLoop", "NSString", "NSThread", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core","NSApplication", "NSColor", "NSDragging", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWConfiguration", "CWInterface", "CWNetwork", "CWNetworkProfile", "CWWiFiClient", "CoreWLANTypes"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothDevice", "IOBluetoothHostController", "IOBluetoothObject", "IOBluetoothUserLib"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
