[package]
name = "islet"
description = "Islet: a lightweight Dynamic Island-style overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
islet-core = { path = "../islet-core" }
islet-render = { path = "../islet-render" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
zune-jpeg = "0.4"

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "Devices_Enumeration",
  "Devices_Power",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "System_Power",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSOperation", "NSRunLoop", "NSString", "NSThread", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core","NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
