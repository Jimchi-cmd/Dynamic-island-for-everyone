[workspace]
members = ["src-tauri", "perf"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/islet"
rust-version = "1.80"

[profile.release]
# Small, fast binaries: the install-size budget is 20 MB.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
