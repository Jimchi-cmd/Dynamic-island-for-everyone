[workspace]
members = ["crates/islet-core", "crates/islet-render", "crates/islet", "src-tauri", "perf"]
default-members = ["crates/islet-core", "crates/islet-render", "crates/islet", "perf"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/islet"
rust-version = "1.82"

[profile.release]
# Small, fast binaries: the install-size budget is 20 MB.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
